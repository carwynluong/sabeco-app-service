apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sabeco-app-ingress
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    appgw.ingress.kubernetes.io/health-probe-path: "/health"
spec:
  rules:
  - host: sabeco-app.yourdomain.com  # Update with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sabeco-app-service-internal
            port:
              number: 3000
  tls:
  - hosts:
    - sabeco-app.yourdomain.com
    secretName: sabeco-app-tls-secret
